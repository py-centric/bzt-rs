[package]
name = "pummel"
version = "0.1.0"
edition = "2024"

[features]
default = []
grpc = [
    "dep:tonic",
    "dep:prost",
    "dep:prost-reflect",
    "dep:tonic-reflection",
    "dep:prost-types",
    "dep:tokio-stream",
    "dep:async-stream",
    "dep:tonic-build",
]
xpath = ["dep:sxd-document", "dep:sxd-xpath"]
influxdb-reporter = ["dep:influxdb", "dep:uuid"]
faker-macros = ["dep:fake", "dep:uuid"]

[dependencies]
goose = { version = "0.18" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1.0"
toml = "0.8"
regex = "1.10"
fake = { version = "2.9", optional = true }
uuid = { version = "1.6", features = ["v4"], optional = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
csv = "1.3"
quick-xml = "0.41"
serde_json_path = "0.7"
clap = { version = "4.6.0", features = ["derive"] }
axum = { version = "0.8.1", features = ["ws"] }
thiserror = "2.0"
tokio-tungstenite = "0.26"
futures-util = "0.3"
tonic = { version = "0.12", features = ["tls"], optional = true }
prost = { version = "0.13", optional = true }
influxdb = { version = "0.8", features = ["serde"], optional = true }
tonic-reflection = { version = "0.12", optional = true }
prost-reflect = { version = "0.14", features = ["serde"], optional = true }
prost-types = { version = "0.13", optional = true }
tokio-stream = { version = "0.1", features = ["net"], optional = true }
async-stream = { version = "0.3", optional = true }
sxd-document = { version = "0.3", optional = true }
sxd-xpath = { version = "0.4", optional = true }

[dev-dependencies]
cargo-llvm-cov = "0.5"
ntest = "0.9.5"
tempfile = "3.8"
tower = "0.5.3"
tower-http = "0.6.8"

[build-dependencies]
tonic-build = { version = "0.12", optional = true }
